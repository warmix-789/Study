<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background-color: #f5f5f7; }
        .apple-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="apple-card p-4" style="width: 350px;">
        <h4 class="mb-4 text-center fw-bold">Новый аккаунт</h4>
        
        {% if error %}
            <div class="alert alert-danger p-2 text-center small rounded-3">{{ error }}</div>
        {% endif %}

        <form action="/register" method="post">
            <input type="text" name="name" class="form-control rounded-4 mb-3 px-3 py-2" placeholder="ФИО" required>
            <input type="text" name="username" class="form-control rounded-4 mb-3 px-3 py-2" placeholder="Придумайте логин" required>
            <input type="password" name="password" class="form-control rounded-4 mb-4 px-3 py-2" placeholder="Придумайте пароль" required>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-medium">Создать</button>
        </form>
        <div class="mt-4 text-center">
            <a href="/login" class="text-decoration-none small text-secondary">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</body>
</html>
