<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход в HRM</title>
    <!-- Мета-теги для мобильного приложения PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background-color: #1c1c1e; color: #f5f5f7; }
        .apple-card { background: rgba(44, 44, 46, 0.9); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
        .form-control { background-color: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; }
        .form-control:focus { background-color: #3a3a3c; border-color: #0a84ff; color: #fff; box-shadow: none; }
        
        /* Исправляем цвет невидимых подсказок (плейсхолдеров) */
        .form-control::placeholder { color: #98989d !important; opacity: 1; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="apple-card p-4" style="width: 350px; max-width: 90%;">
        <h4 class="mb-4 text-center fw-bold">Вход в систему</h4>
        
        {% if error %}
            <div class="alert alert-danger p-2 text-center small rounded-3 border-danger bg-transparent text-danger">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <input type="text" name="username" class="form-control rounded-4 mb-3 px-3 py-2" placeholder="Логин (например, user1)" required>
            <input type="password" name="password" class="form-control rounded-4 mb-4 px-3 py-2" placeholder="Пароль" required>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-medium">Войти</button>
        </form>
    </div>
</body>
</html>
